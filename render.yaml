# Render blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: wanderlust
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ATLASDB_URL
        sync: false   # set in the Render dashboard
      - key: SECRET
        sync: false   # set in the Render dashboard
      - key: CLOUD_NAME
        sync: false
      - key: CLOUD_API_KEY
        sync: false
      - key: CLOUD_API_SECRET
        sync: false
